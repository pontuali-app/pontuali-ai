name: pages

# The site is the README and the guides of this repository, rendered by Jekyll (the GitHub Pages toolchain).
# A pull request only BUILDS it, to catch a broken page before the merge. Only a push to main DEPLOYS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing is writable unless a job asks for it below.
permissions: {}

# One deployment at a time; a newer push replaces a waiting one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: The pages that clients rely on exist
        run: |
          test -s _site/index.html
          test -s _site/docs/index.html
          grep -q "mcp.pontuali.com.br/mcp" _site/docs/index.html
          # No real access token can end up on a public page.
          if grep -rEq 'pat_[A-Za-z0-9_-]{43}' _site; then echo "a token-like string is in the site"; exit 1; fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
