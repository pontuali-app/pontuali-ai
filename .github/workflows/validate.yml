name: validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Manifests are valid JSON and agree with each other
        run: |
          python3 - <<'PY'
          import json, sys
          plugin = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))
          market = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          mcp = json.load(open(".mcp.json", encoding="utf-8"))
          registry = json.load(open("server.json", encoding="utf-8"))
          assert market["plugins"][0]["name"] == plugin["name"], "marketplace entry and plugin name must match"
          assert registry["version"] == plugin["version"], "server.json and plugin.json versions must match"
          server = mcp["mcpServers"]["pontuali"]
          assert server["type"] == "http" and server["url"].startswith("https://"), "MCP server must be https"
          assert "${user_config." in server["headers"]["Authorization"], "the token must come from user config, never from the file"
          print("manifests OK")
          PY

      - name: Every skill has a name and a description
        run: |
          for f in skills/*/SKILL.md; do
            head -5 "$f" | grep -q '^name: ' && head -5 "$f" | grep -q '^description: ' || { echo "bad frontmatter: $f"; exit 1; }
          done

      - name: No access token is committed
        run: |
          # Example values in the docs are written as pat_... ; a real token is pat_ plus 43 base64url characters.
          if grep -rEn 'pat_[A-Za-z0-9_-]{43}' --exclude-dir=.git . ; then echo "a real-looking token is committed"; exit 1; fi
